name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # We removed 'cache: npm' because the GitHub cache service is currently down (400 error)

      - name: 🚀 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.0.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build APK (FREE LOCAL MODE)
        # --local bypasses the Expo Free Plan monthly limit
        # --clear-cache fixes the "Services aren't available" error
        env:
          EAS_BUILD_DISABLE_NPM_CACHE: 1
        run: eas build --platform android --profile preview --non-interactive --local --clear-cache --output=./app-release.apk

      - name: 📤 Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDStream-APK
          path: ./app-release.apk
